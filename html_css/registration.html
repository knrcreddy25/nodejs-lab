 <div class="container1">

 <main>
 <center><br>
 <h3 style="color: #d90429; margin-bottom: 10px; font-family: monospace;">Registration
Form</h3>
<br/>
<form name="f1">
 <table cellpadding="4" align="center" style="font-family: monospace;">

 <!-- Name Input -->
 <tr>
 <td style="color: #d90429; font-weight: bold;">Name:*</td>
 <td><input type="text" name="username"></td>
 </tr>

 <!-- Password Input -->
 <tr>
 <td style="color: #d90429; font-weight: bold;">Password:*</td>
 <td><input type="password" name="password"></td>
 </tr>

 <!-- Email Input -->
 <tr>
 <td style="color: #d90429; font-weight: bold;">Email ID:*</td>
 <td><input type="email" name="email"></td>  </tr>

 <!-- Phone Number Input -->
 <tr>
 <td style="color: #d90429; font-weight: bold;">Phone Number:*</td>
 <td><input type="tel" name="phno"></td>
 </tr>

 <!-- Gender Radio Selection -->
 <tr>
 <td valign="top" style="color: #d90429; font-weight: bold;">Gender:*</td>
 <td style="color: #d90429;">
 <input type="radio" name="gender" value="1" id="genderMale"> <label for="genderMale">Male</label>&nbsp;&nbsp;
 <input type="radio" name="gender" value="2" id="genderFemale"> <label for="genderFemale">Female</label>&nbsp;&nbsp;
 <input type="radio" name="gender" value="3" id="genderOther"> <label for="genderOther">Other</label>
 </td>
 </tr>

 <!-- Address Textarea -->
 <tr>
 <td valign="top" style="color: #d90429; font-weight: bold;">Address:*</td>
 <td><textarea name="address"></textarea></td>
 </tr>

 <!-- Spacer Row -->
 <tr><td colspan="2"><br></td></tr>

 <!-- Action Control Buttons -->
 <tr>
 <td></td>
 <td>
 <input type="submit" value="Submit">
 <input type="reset" value="Reset">  </td>
 </tr>

 <!-- Footer Notification Info Row -->
 <tr>
 <td colspan="2" style="font-size: 12px; padding-top: 15px; color: #8b949e;">
 *<span style="color: #ff7b72;">fields are mandatory</span>
 </td>
 </tr>
 </table>
</form>
 </center>
