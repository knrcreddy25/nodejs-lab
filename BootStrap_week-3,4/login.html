<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Online Books Store - Login</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

      <link rel="stylesheet" href="style.css">

</head>

<body>

<!-- Header -->

<header class="container-fluid">

    <div class="container">

        <div class="row align-items-center">

            <div class="col-md-2 col-12 text-center">
                <img src="logo.avif" class="img-fluid" width="75" alt="Logo">
            </div>

            <div class="col-md-10 col-12 text-center">
                <h1>ONLINE BOOKS STORE</h1>
            </div>

        </div>

    </div>

</header>

<!-- Navigation -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="#">Book Store</a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#menu">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="menu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">
                    <a class="nav-link" href="index.html">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="login.html">Login</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="registration.html">Registration</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="cart.html">Cart</a>
                </li>

            </ul>

        </div>

    </div>

</nav>

<!-- Login Form -->

<div class="container my-5">

    <div class="login-box">

        <h3 class="text-center mb-4">Login Details</h3>

        <form>

            <div class="mb-3">

                <label class="form-label">User Name</label>

                <input type="text"
                       class="form-control"
                       placeholder="Enter Username">

            </div>

            <div class="mb-3">

                <label class="form-label">Password</label>

                <input type="password"
                       class="form-control"
                       placeholder="Enter Password">

            </div>

            <div class="text-center">

                <button type="submit" class="btn btn-primary">
                    Submit
                </button>

                <button type="reset" class="btn btn-secondary">
                    Reset
                </button>

            </div>

        </form>

    </div>

</div>

<!-- Footer -->

<footer>

    (C) 2024 All rights reserved by Online Books Store

</footer>

<!-- Bootstrap JS -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
