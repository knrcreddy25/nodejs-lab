<!DOCTYPE html>

<head>

<!-- Header -->

<header class="container-fluid">

            </div>

        </div>

    </div>

</header>

<!-- Navigation -->

<nav class="navbar navbar-expand-md navbar-dark bg-dark">

    <div class="container">

        <a class="navbar-brand" href="#">Book Store</a>

        <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse" 
                data-bs-target="#menu">

            <span class="navbar-toggler-icon"></span>

        </button>

        <div class="collapse navbar-collapse" id="menu">

            <ul class="navbar-nav ms-auto">

                <li class="nav-item">

                <li class="nav-item">

                </li>

                <li class="nav-item">

                </li>

                <li class="nav-item">
                    <a class="nav-link" href="cart.html">Cart</a>

            </ul>

        </div>

    </div>

</nav>

<div class="container my-5">

    <div class="row g-4">

        <div class="col-lg-4 col-md-6 col-12">

                <img src="book1.webp" class="img-fluid" alt="Java Programming">

                <img src="book2.jpg" class="img-fluid" alt="Python Programming">

        <div class="col-lg-4 col-md-6 col-12">

                <img src="book7.jpg" class="img-fluid" alt="Data Structures">
                <h5 class="mt-3">Data Structures</h5>
